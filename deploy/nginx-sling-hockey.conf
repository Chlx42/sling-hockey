# 弹射冰球 —— 加入 /etc/nginx/sites-enabled/sling-hockey（http {} 下 server {} 内的 location）
# 注意：本文件是 location 片段，需放进 default 站点的 server {} 里，不能独立成站

# 静态客户端
location ^~ /hockey/ {
    alias /opt/sling-hockey/client/;
    index index.html;
    try_files $uri $uri/ /hockey/index.html;
    add_header Cache-Control "no-cache"; # 静态资源始终走 304 校验，避免 MIME/版本踩缓存
}

# HTTP API（排行榜 / 健康）
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3217/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Colyseus HTTP 匹配
location /matchmake/ {
    proxy_pass http://127.0.0.1:3217;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# Colyseus WebSocket：/{processId}/{roomId}
location ~ "^/(?!(hockey|api)(/|$))[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$" {
    proxy_pass http://127.0.0.1:3217;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
